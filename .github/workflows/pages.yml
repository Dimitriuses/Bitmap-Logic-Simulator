name: Deploy to GitHub Pages

# The site is the project root: index.html, css/, the compiled dist/ and the
# schematics under projects/. dist/ is not committed, so Pages is built here
# rather than served straight from a branch.
#
# Repository setup, once: Settings -> Pages -> Source: "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Stage the site
        # Everything the page actually requests, and nothing else — the specs,
        # the build sources and the tooling stay out of the published site.
        run: |
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css dist projects _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
